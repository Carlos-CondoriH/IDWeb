<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Registro de nuevos estudiantes</h1>
    <fieldset>
        <legend>Información Personal</legend>
        <div>
            <label for="nombre">Nombres Completos</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div>
            <label for="codigo">Código de estudiante</label>
            <input type="text" id="codigo" name="codigo" required pattern="[0-9]{8}">
        </div>
        <div>
            <label for="fecha">Fecha de nacimiento</label>
            <input type="date" id="nacimiente" name="nacimiento" required>
        </div>
        <div>
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" required>
        </div>
        <div>
            <label for="carrera">Carrera profesional</label>
            <select name="carrera" id="carrera" required>
                <option value="">-- Selecciona una carrera --</option>
                <option value="sistemas">Ingeniería de Sistemas</option>
            </select>
        </div>
        <div>
            <label for="turno">Turno</label>
            <div>
                <input type="radio" id="turno-manaña" name="turno" required>
                <label for="turno-manaña">Mañana</label>
            </div>
            <div>
                <input type="radio" id="turno-tarde" name="turno" required>
                <label for="turno-tarde">Tarde</label>
            </div>
            <div>
                <input type="radio" id="turno-noche" name="turno" required>
                <label for="turno-noche">Noche</label>
            </div>
        </div>
    </fieldset>
    <fieldset>
        <legend>Información de la Cuenta</legend>
        <div>
            <label for="correo">Correo institucional</label>
            <input type="email" id="correo" name="correo" required>
        </div>
        <div>
            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" name="contraseña" required>
        </div>
        <div>
            <label for="comentario">Comentarios</label>
            <div>
                <textarea name="comentario" id="comentario"></textarea>
            </div>
        </div>
        <div>
            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto los términos y condiciones</label>
        </div>
    </fieldset>
</body>
</html>
